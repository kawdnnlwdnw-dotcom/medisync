<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediSync Iraq | تيسير تبادل فائض المخزون الدوائي</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<style>
:root{--bg:#0F172A;--card:#1E293B;--border:#334155;--text:#F8FAFC;--muted:#94A3B8;--green:#10B981;--orange:#F59E0B;--red:#EF4444}
[data-theme="light"]{--bg:#F8FAFC;--card:#FFF;--border:#E2E8F0;--text:#0F172A;--muted:#64748B}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter','IBM Plex Sans Arabic',system-ui,sans-serif}
body{background:var(--bg);color:var(--text)}
.top{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border);z-index:30}
.logo-box{width:40px;height:40px;border-radius:12px;background:var(--green);display:flex;align-items:center;justify-content:center}
.brand{font-weight:800;font-size:1.05rem}
.spacer{flex:1}
.icon-btn{background:none;border:none;color:var(--text);font-size:1.15rem;cursor:pointer;padding:6px;position:relative}
.badge{position:absolute;top:-5px;right:-6px;background:var(--green);color:#06130a;font-size:.62rem;font-weight:800;border-radius:999px;padding:1px 5px}
[dir="rtl"] .badge{right:auto;left:-6px}
.page{display:none;padding:16px;max-width:1000px;margin:auto}
.page.active{display:block}
.hero{text-align:center;padding:30px 10px 10px}
.hero h1{font-size:1.6rem;margin-bottom:8px}
.hero p{color:var(--muted);font-size:.92rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:18px 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 8px;text-align:center;display:flex;flex-direction:column;gap:7px;align-items:center;min-height:150px;cursor:pointer}
.cwrap{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px}
.cwrap.g{background:rgba(16,185,129,.15)}.cwrap.o{background:rgba(245,158,11,.15)}.cwrap.b{background:rgba(59,130,246,.15)}
.card h3{font-size:.85rem}.card p{color:var(--muted);font-size:.68rem}
.link{color:var(--green);font-weight:700;cursor:pointer;font-size:.8rem}
h2.title,.mtitle{margin:14px 0 6px;font-weight:800}
p.sub{color:var(--muted);margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:.83rem;margin-bottom:5px;color:var(--muted)}
input,select{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--green);color:#06130a;border:none;border-radius:10px;padding:12px;font-weight:800;cursor:pointer;width:100%}
.btn:disabled{opacity:.5}
.btn.small{width:auto;padding:8px 12px;font-size:.8rem}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px;font-weight:700;width:100%;cursor:pointer}
.file-drop{border:1.5px dashed var(--border);border-radius:12px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;display:block;margin-top:5px}
.file-drop input{display:none}
.auth{max-width:460px;margin:20px auto}
.tabs{display:flex;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:5px;margin-bottom:18px}
.tab{flex:1;text-align:center;padding:10px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:700}
.tab.active{background:var(--border);color:var(--text)}
.search-bar{display:flex;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px}
.search-bar input{border:none;background:transparent;padding:0;width:100%}
.filters{display:flex;gap:10px;margin:12px 0}
.filters select{flex:1}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:14px}
.mcard{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.mimg{height:140px;background:#22282c;display:flex;align-items:center;justify-content:center;overflow:hidden}
.mimg img{width:100%;height:100%;object-fit:cover}
.mbody{padding:0 12px;display:flex;flex-direction:column;gap:7px}
.cat{color:var(--muted);font-size:.78rem}
.badge-exp{font-size:.7rem;color:var(--orange);border:1px solid var(--orange);border-radius:999px;padding:2px 8px;align-self:flex-start}
.badge-ocr{font-size:.7rem;border-radius:999px;padding:2px 8px;align-self:flex-start}
.ocr-ok{color:var(--green);border:1px solid var(--green)}
.ocr-rev{color:var(--red);border:1px solid var(--red)}
.prices{display:flex;gap:8px;align-items:center}
.new{color:var(--green);font-weight:800}
.empty{color:var(--muted);text-align:center;padding:26px}
.info-note{background:rgba(16,185,129,.08);border:1px solid var(--green);color:var(--green);border-radius:12px;padding:12px;font-size:.85rem;line-height:1.6;margin-bottom:14px}
.legal-note{background:rgba(239,68,68,.08);border:1px solid var(--red);color:var(--red);border-radius:12px;padding:12px;font-size:.85rem;line-height:1.6;margin-bottom:14px}
.success{background:rgba(16,185,129,.15);color:var(--green);border:1px solid var(--green);border-radius:10px;padding:10px;margin-top:10px;display:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:40}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:320px;max-width:88%;background:var(--card);z-index:50;transform:translateX(100%);transition:.25s;padding:18px;overflow:auto}
[dir="rtl"] .drawer{right:auto;left:0;transform:translateX(-100%)}
.drawer.show{transform:none}
.menu-link{display:block;padding:11px 6px;border-bottom:1px solid var(--border);color:var(--text);cursor:pointer;font-weight:600}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;background:rgba(0,0,0,.6);padding:16px}
.modal.show{display:flex}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:500px;width:100%;padding:22px;display:flex;flex-direction:column;gap:10px;max-height:90vh;overflow:auto}
.close-x{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;align-self:flex-end}
.checkbox-container{display:flex;gap:10px;margin:12px 0;padding:12px;background:rgba(16,185,129,.05);border-radius:8px;border:1px solid var(--green)}
.checkbox-container input{width:auto;margin-top:4px}
.status-badge{padding:4px 8px;border-radius:6px;font-size:.7rem;font-weight:700}
.status-online{background:rgba(16,185,129,.15);color:var(--green)}
.status-offline{background:rgba(239,68,68,.15);color:var(--red)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.stat .num{font-size:1.3rem;font-weight:800;color:var(--green)}
.stat .lbl{color:var(--muted);font-size:.72rem;margin-top:4px}
.bar-row{display:flex;align-items:center;gap:8px;margin:5px 0}
.bar-lbl{width:100px;font-size:.73rem;color:var(--muted)}
.bar-track{flex:1;background:var(--border);border-radius:6px;height:13px;overflow:hidden}
.bar-fill{height:100%;background:var(--green)}
.bar-val{width:35px;font-size:.73rem}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th,td{text-align:right;padding:7px 5px;border-bottom:1px solid var(--border)}
th{color:var(--muted)}
#mapDiv{height:420px;border-radius:16px;border:1px solid var(--border);z-index:1}
.notif-item{padding:10px;border-bottom:1px solid var(--border);font-size:.83rem}
.notif-item b{color:var(--green)}
.notif-time{color:var(--muted);font-size:.68rem}
.ocr-status{font-size:.73rem;margin-top:5px;min-height:1em}
.lic-img{width:100%;border-radius:10px;border:1px solid var(--border)}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="errBanner" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#7f1d1d;color:#fff;padding:8px;font-size:.75rem;z-index:200;text-align:center"></div>

<header class="top">
  <div class="logo-box">💊</div><span class="brand">MediSync Iraq</span><span class="spacer"></span>
  <span id="connStatus" class="status-badge status-online" style="font-size:.7rem">متصل</span>
  <button class="icon-btn" id="notifBtn">🔔<span class="badge" id="notifCount">0</span></button>
  <button class="icon-btn" id="langBtn" style="font-weight:700" onclick="toggleLang()">EN</button>
  <button class="icon-btn" id="themeBtn">☀️</button>
  <button class="icon-btn" id="menuBtn">☰</button>
</header>

<section class="page active" id="page-home">
  <div class="hero"><h1 data-i18n="hero_t"></h1><p data-i18n="hero_s"></p></div>
  <div class="cards">
    <div class="card" data-gate="list-form"><span class="cwrap g">📦</span><h3 data-i18n="c_list_t"></h3><p data-i18n="c_list_d"></p><span class="link" data-i18n="start"></span></div>
    <div class="card" data-gate="browse"><span class="cwrap o">🧭</span><h3 data-i18n="c_br_t"></h3><p data-i18n="c_br_d"></p><span class="link" data-i18n="start"></span></div>
    <div class="card" data-nav="map"><span class="cwrap b">🗺️</span><h3 data-i18n="c_map_t"></h3><p data-i18n="c_map_d"></p><span class="link" data-i18n="start"></span></div>
    <div class="card" data-nav="reports"><span class="cwrap g">📊</span><h3 data-i18n="c_rep_t"></h3><p data-i18n="c_rep_d"></p><span class="link" data-i18n="start"></span></div>
  </div>
</section>

<section class="page" id="page-auth">
  <div class="auth">
    <div class="tabs"><div class="tab active" id="tabLogin" onclick="switchTab('login')" data-i18n="tab_login"></div><div class="tab" id="tabSignup" onclick="switchTab('signup')" data-i18n="tab_signup"></div></div>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field"><label data-i18n="f_email"></label><input id="liEmail" type="email" required></div>
      <div class="field"><label data-i18n="f_pass"></label><input id="liPass" type="password" required></div>
      <button class="btn" data-i18n="login_btn"></button>
    </form>
    <form id="signupForm" style="display:none" onsubmit="handleSignup(event)">
      <div class="legal-note" data-i18n-html="private_sector_only"></div>
      <div class="field"><label data-i18n="f_phname"></label><input id="suName" type="text" placeholder="مثال: صيدلية الترياق" required></div>
      <div class="row2">
        <div class="field"><label data-i18n="f_lic"></label><input id="suLic" type="text" placeholder="مثال: 9686" required></div>
        <div class="field"><label data-i18n="f_phone"></label><input id="suPhone" type="tel" required></div>
      </div>
      <div class="row2">
        <div class="field"><label data-i18n="f_region"></label><select id="suRegion"><option>بغداد</option><option>البصرة</option><option>نينوى</option><option>أربيل</option><option>السليمانية</option><option>الأنبار</option><option>بابل</option><option>ذي قار</option><option>كركوك</option><option>أخرى</option></select></div>
        <div class="field"><label data-i18n="f_gps"></label><button type="button" class="btn-ghost" onclick="getGPS()">📍 <span data-i18n="gps_btn"></span></button><span class="ocr-status" id="gpsStatus"></span></div>
      </div>
      <div class="row2">
        <div class="field"><label data-i18n="f_email"></label><input id="suEmail" type="email" required></div>
        <div class="field"><label data-i18n="f_pass"></label><input id="suPass" type="password" minlength="6" required></div>
      </div>
      <div class="field"><label data-i18n="f_licphoto"></label>
        <label class="file-drop" for="suLicImg"><span data-i18n="upload_lic"></span><input id="suLicImg" type="file" accept="image/*" required></label>
        <p class="ocr-status" id="licOcrStatus"></p>
      </div>
      <div class="checkbox-container"><input type="checkbox" id="tcAgree" required><label for="tcAgree" style="font-size:.78rem;line-height:1.5" data-i18n-html="tc_agree_text"></label></div>
      <button class="btn" id="signupBtn" data-i18n="create_btn"></button>
    </form>
  </div>
</section>

<section class="page" id="page-list-form">
  <h2 class="title" data-i18n="list_t"></h2><p class="sub" data-i18n="list_s"></p>
  <div class="legal-note" data-i18n-html="restrictions_note"></div>
  <form id="listForm" onsubmit="handleList(event)">
    <div class="row2">
      <div class="field"><label data-i18n="f_name"></label><input id="lName" type="text" required></div>
      <div class="field"><label data-i18n="f_sci"></label><input id="lSci" type="text" required></div>
    </div>
    <div class="row2">
      <div class="field"><label data-i18n="f_cat"></label><select id="lCat" required><option value="">...</option><option value="tablets">أقراص</option><option value="syrup">شراب</option><option value="topical">موضعي</option><option value="other">أخرى</option></select></div>
      <div class="field"><label data-i18n="f_exp"></label><input id="lExp" type="date" required></div>
    </div>
    <div class="field"><label data-i18n="f_images"></label>
      <div class="row2">
        <label class="file-drop" for="imgMed"><span data-i18n="upload_med"></span><input id="imgMed" type="file" accept="image/*" required></label>
        <label class="file-drop" for="imgExp"><span data-i18n="upload_exp"></span><input id="imgExp" type="file" accept="image/*" required></label>
      </div><p class="ocr-status" id="expOcrStatus"></p>
    </div>
    <div class="field"><label data-i18n="f_qr"></label><input id="lQr" type="text"></div>
    <div class="row2">
      <div class="field"><label data-i18n="f_qty"></label><input id="lQty" type="number" min="1" required></div>
      <div class="field"><label data-i18n="f_val"></label><input id="lVal" type="number" min="0" required></div>
    </div>
    <div class="checkbox-container"><input type="checkbox" id="distAgree" required><label for="distAgree" style="font-size:.78rem;line-height:1.5" data-i18n-html="dist_agree_text"></label></div>
    <button class="btn" type="submit" data-i18n="submit_list"></button>
    <div class="success" id="listSuccess"></div>
  </form>
</section>

<section class="page" id="page-browse">
  <h2 class="mtitle" data-i18n="browse_t"></h2>
  <div class="search-bar">🔍<input id="bSearch" data-i18n-ph="search_ph"></div>
  <div class="filters"><select id="bCat"><option value="all">الكل</option><option value="tablets">أقراص</option><option value="syrup">شراب</option><option value="topical">موضعي</option></select><select id="bSort"><option value="expiry">الأقرب للانتهاء</option><option value="value">الأقل قيمة</option></select></div>
  <div class="mgrid" id="marketGrid"></div>
</section>

<section class="page" id="page-reports">
  <h2 class="mtitle" data-i18n="rep_t"></h2>
  <div class="stat-grid" id="repStats"></div>
  <h3 data-i18n="by_cat"></h3><div id="repCats"></div>
  <h3 style="margin-top:12px" data-i18n="by_region"></h3><div id="repRegions"></div>
  <h3 style="margin-top:12px" data-i18n="recent_tr"></h3>
  <div style="overflow:auto"><table id="repTable"><thead><tr><th>السند</th><th>التاريخ</th><th>من</th><th>إلى</th><th>القيمة</th></tr></thead><tbody></tbody></table></div>
  <button class="btn" style="margin-top:14px" onclick="exportCSV()">📥 <span data-i18n="export_btn"></span></button>
</section>

<section class="page" id="page-map">
  <h2 class="mtitle" data-i18n="map_t"></h2><p class="sub" data-i18n="map_s"></p>
  <div id="mapDiv"></div>
</section>

<section class="page" id="page-admin">
  <h2 class="mtitle">⚙️ <span data-i18n="admin_t"></span></h2>
  <p class="sub" data-i18n="admin_s"></p>
  <div id="reviewQueue"></div>
</section>

<div class="overlay" id="overlay"></div>

<div class="modal" id="transferModal"><div class="modal-box">
  <button class="close-x" onclick="closeModal('transferModal')">✕</button>
  <h3 data-i18n="modal_transfer_title"></h3>
  <div class="info-note" style="font-size:.8rem"><p><b data-i18n="m_item"></b> <span id="tName"></span></p><p><b data-i18n="m_batch"></b> <span id="tBatch"></span></p><p><b data-i18n="m_val"></b> <span id="tVal"></span></p></div>
  <div class="legal-note" style="font-size:.78rem" data-i18n-html="receiver_ack"></div>
  <div class="checkbox-container"><input type="checkbox" id="signAgree"><label for="signAgree" style="font-size:.83rem;font-weight:700" data-i18n="i_acknowledge"></label></div>
  <button class="btn" id="confirmTransferBtn" onclick="confirmTransfer()" disabled data-i18n="confirm_transfer"></button>
</div></div>

<div class="modal" id="invoiceModal"><div class="modal-box" style="max-width:420px">
  <button class="close-x" onclick="closeModal('invoiceModal')">✕</button>
  <h3 style="color:var(--green);text-align:center" data-i18n="inv_t"></h3>
  <div style="font-size:.83rem;line-height:1.9">
    <p><b data-i18n="inv_id"></b> <span id="invId"></span></p><p><b data-i18n="inv_date"></b> <span id="invDate"></span></p>
    <p><b data-i18n="inv_from"></b> <span id="invFrom"></span></p><p><b data-i18n="inv_to"></b> <span id="invTo"></span></p>
    <p><b data-i18n="inv_sig"></b> <span id="invSig" style="font-size:.62rem;word-break:break-all"></span></p>
    <p><b data-i18n="inv_val"></b> <span id="invVal"></span> د.ع</p>
  </div>
  <button class="btn" onclick="closeModal('invoiceModal')" data-i18n="close"></button>
</div></div>

<div class="modal" id="licModal"><div class="modal-box">
  <button class="close-x" onclick="closeModal('licModal')">✕</button>
  <h3 data-i18n="view_lic"></h3>
  <p class="cat" id="lmInfo"></p>
  <img id="lmImg" class="lic-img">
  <button class="btn" id="lmApprove" data-i18n="approve"></button>
</div></div>

<div class="drawer" id="menuDrawer">
  <h3 data-i18n="menu_h"></h3>
  <span class="menu-link" data-nav="home" data-i18n="menu_home"></span>
  <span class="menu-link" data-gate="list-form" data-i18n="menu_list"></span>
  <span class="menu-link" data-gate="browse" data-i18n="menu_browse"></span>
  <span class="menu-link" data-nav="map" data-i18n="menu_map"></span>
  <span class="menu-link" data-nav="reports" data-i18n="menu_reports"></span>
  <span class="menu-link" onclick="adminLogin()" style="color:var(--orange)">⚙️ <span data-i18n="menu_admin"></span></span>
  <span class="menu-link" onclick="logout()" style="color:var(--red)" data-i18n="logout"></span>
</div>

<div class="drawer" id="notifDrawer">
  <h3 data-i18n="notif_t"></h3>
  <div class="checkbox-container"><input type="checkbox" id="notifToggle" checked onchange="toggleNotif(this.checked)"><label for="notifToggle" style="font-size:.83rem" data-i18n="notif_enable"></label></div>
  <button class="btn small" onclick="testNotif()">🔔 <span data-i18n="test_notif"></span></button>
  <div id="notifList" style="margin-top:10px"></div>
</div>

<script>
"use strict";
window.addEventListener('error',function(e){var b=document.getElementById('errBanner');if(b){b.style.display='block';b.textContent='⚠️ '+e.message+' (line '+e.lineno+')';}});
var SUP_CODE='SUP-9686';
function load(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var LANG=load('ms_lang','ar'),session=load('ms_session',null),staff=load('ms_staff',false),gpsPos=null,map=null,selId=null;
var listings=load('ms_listings',[{id:1,name:"Panadol Extra",sci:"Paracetamol",cat:"tablets",exp:"2026-12-01",qty:20,val:15000,pharmacy:"صيدلية الترياق",batch:"B12345",region:"بغداد",ocr:{exp:'demo'}}]);

function t(k){return (I18N[LANG][k]||k)}

function normDigits(s){return String(s).replace(/[\u0660-\u0669]/g,function(d){return String(d.charCodeAt(0)-1632)}).replace(/[\u06F0-\u06F9]/g,function(d){return String(d.charCodeAt(0)-1776)})}

function fallbackHash(str){var h=5381;for(var i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return 'fb_'+(h>>>0).toString(16)+'_'+str.length}
function sha256(str){
  if(window.crypto&&crypto.subtle){
    return crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}).catch(function(){return fallbackHash(str)});
  }
  return Promise.resolve(fallbackHash(str));
}

function ocrImage(file,cb){
  if(!window.Tesseract)return Promise.resolve({text:'',ok:false});
  return Tesseract.recognize(file,'ara+eng',{logger:function(m){if(m.status==='recognizing text'&&cb)cb(Math.round(m.progress*100))}}).then(function(r){return{text:r.data.text||'',ok:true}}).catch(function(){return{text:'',ok:false}});
}

function matchLicense(text,lic,name){
  var d=normDigits(text).replace(/\D/g,'');
  var ld=normDigits(lic).replace(/\D/g,'');
  var licOK=ld.length>=3&&d.indexOf(ld)>=0;
  var words=String(name).replace(/صيدلية|الصيدلية/g,'').split(/\s+/).filter(function(x){return x.length>=2});
  var nameOK=words.some(function(w){return text.indexOf(w)>=0});
  if(licOK&&nameOK)return 'verified';
  if(licOK||nameOK)return 'partial';
  return 'review';
}

function matchExpiry(text,exp){
  var y=+exp.slice(0,4),mo=+exp.slice(5,7);
  var n=normDigits(text),f=[],m;
  var r1=/(20\d{2})\s*[\/\-.]\s*(1[0-2]|0?[1-9])/g;
  while((m=r1.exec(n))!==null)f.push([+m[1],+m[2]]);
  var r2=/(1[0-2]|0?[1-9])\s*[\/\-.]\s*(20\d{2})/g;
  while((m=r2.exec(n))!==null)f.push([+m[2],+m[1]]);
  for(var i=0;i<f.length;i++){if(f[i][0]===y&&f[i][1]===mo)return 'verified';}
  for(var j=0;j<f.length;j++){if(f[j][0]===y)return 'partial';}
  return 'review';
}

function compressImage(file,maxW,q){
  maxW=maxW||800;q=q||0.55;
  return new Promise(function(res,rej){
    if(!file.type.startsWith('image/'))return rej(new Error('not image'));
    var r=new FileReader();
    r.onload=function(e){
      var i=new Image();
      i.onload=function(){
        var c=document.createElement('canvas');
        var w=i.width,h=i.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        c.width=w;c.height=h;
        c.getContext('2d').drawImage(i,0,0,w,h);
        fetch(c.toDataURL('image/webp',q)).then(function(x){return x.blob()}).then(function(b){res(new File([b],'i.webp',{type:'image/webp'}))}).catch(rej);
      };
      i.onerror=rej;
      i.src=e.target.result;
    };
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

function fileToDataUrl(f){return new Promise(function(r){var x=new FileReader();x.onload=function(e){r(e.target.result)};x.readAsDataURL(f)})}

function pushNotify(title,body){
  notifs.unshift({title:title,body:body,time:Date.now()});
  notifs=notifs.slice(0,50);save('ms_notifs',notifs);renderNotifBadge();
  if(!load('ms_notif_enabled',true))return;
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  try{
    if(navigator.serviceWorker){
      navigator.serviceWorker.getRegistration().then(function(r){
        if(r){r.showNotification(title,{body:body});}else{try{new Notification(title,{body:body})}catch(e){}}
      }).catch(function(){try{new Notification(title,{body:body})}catch(e){}});
    }else{new Notification(title,{body:body});}
  }catch(e){}
}

async function handleSignup(e){
  e.preventDefault();
  if(!$('tcAgree').checked){alert('⚠️');return}
  var f=$('suLicImg').files[0];
  if(!f){alert('⚠️');return}
  var em=$('suEmail').value.trim().toLowerCase();
  for(var i=0;i<users.length;i++){if(users[i].email.toLowerCase()===em){alert(t('email_dup'));return}}
  $('signupBtn').disabled=true;
  $('licOcrStatus').textContent=t('ocr_check');
  var ocr=await ocrImage(f,function(p){$('licOcrStatus').textContent=t('ocr_check')+' '+p+'%'});
  var st=ocr.ok?matchLicense(ocr.text,$('suLic').value,$('suName').value):'review';
  $('licOcrStatus').textContent=(st==='verified')?t('ocr_lic_ok'):((st==='partial')?t('ocr_lic_part'):t('ocr_lic_no'));
  var licFile=f;
  try{licFile=await compressImage(f,900,0.6)}catch(err){licFile=f}
  var licUrl=await fileToDataUrl(licFile);
  users.push({id:'u'+Date.now(),name:$('suName').value.trim(),lic:$('suLic').value.trim(),phone:$('suPhone').value.trim(),email:em,pass:$('suPass').value,region:$('suRegion').value,lat:gpsPos?gpsPos.lat:null,lng:gpsPos?gpsPos.lng:null,licStatus:st,licImg:licUrl,role:'pharmacy'});

  $('signupBtn').disabled=false;
  session=users[users.length-1].id;save('ms_session',session);
  ensureNotif();show('home');
}

async function handleList(e){
  e.preventDefault();
  var exp=$('lExp').value;
  var days=Math.ceil((new Date(exp).getTime()-Date.now())/864e5);
  if(days<30){alert(LANG==='ar'?'⛔ أقل من 30 يوماً':'⛔ <30 days');return}
  var mf=$('imgMed').files[0],ef=$('imgExp').files[0];
  if(!mf||!ef){alert('⚠️');return}
  var btn=e.target.querySelector('button[type=submit]');
  btn.disabled=true;btn.textContent=t('ocr_check');
  try{
    var cMed=await compressImage(mf,800,0.55);
    var cExp=await compressImage(ef,800,0.55);
    $('expOcrStatus').textContent=t('ocr_check');
    var ocr=await ocrImage(cExp,function(p){$('expOcrStatus').textContent=t('ocr_check')+' '+p+'%'});
    var es=ocr.ok?matchExpiry(ocr.text,exp):'review';
    $('expOcrStatus').textContent=(es==='verified')?t('ocr_exp_ok'):t('ocr_exp_no');
    var mu=await fileToDataUrl(cMed);
    var eu=await fileToDataUrl(cExp);
    var u=null;for(var i=0;i<users.length;i++){if(users[i].id===session)u=users[i]}
    var savedKB=Math.round((mf.size+ef.size-cMed.size-cExp.size)/1024);
    listings.push({id:Date.now(),name:$('lName').value.trim(),sci:$('lSci').value.trim(),cat:$('lCat').value,exp:exp,qty:+$('lQty').value,val:+$('lVal').value,pharmacy:u.name,batch:($('lQr').value.trim()||('B'+Math.floor(Math.random()*9999))),region:(u.region||'بغداد'),lat:u.lat,lng:u.lng,medImage:mu,expImage:eu,ocr:{exp:es},savedKB:savedKB});
    save('ms_listings',listings);
    btn.disabled=false;btn.textContent=t('submit_list');
    pushNotify(t('notif_new'),$('lName').value+' — '+u.name);
    $('listSuccess').textContent=(LANG==='ar'?'✅ تم الإدراج — تم توفير ':'✅ Listed — saved ')+savedKB+' KB';
    $('listSuccess').style.display='block';
    setTimeout(function(){$('listSuccess').style.display='none';$('listForm').reset();$('expOcrStatus').textContent=''},4000);
    renderMarket();
  }catch(err){
    btn.disabled=false;btn.textContent=t('submit_list');
    alert('❌ '+err.message);
  }
}

function renderMarket(){
  var q=$('bSearch').value.toLowerCase(),c=$('bCat').value,s=$('bSort').value;
  var it=listings.filter(function(p){
    var mq=!q||p.name.toLowerCase().indexOf(q)>=0||p.sci.toLowerCase().indexOf(q)>=0;
    return mq&&(c==='all'||p.cat===c);
  });
  it.sort(function(a,b){return s==='expiry'?a.exp.localeCompare(b.exp):a.val-b.val});
  var html='';
  it.forEach(function(p){
    var img=p.medImage?'<img src="'+p.medImage+'">':'💊';
    var ocrBadge=(p.ocr&&p.ocr.exp==='verified')?'<span class="badge-ocr ocr-ok">✅ '+(LANG==='ar'?'مطابق':'matched')+'</span>':'';
    html+='<div class="mcard" onclick="openTransfer('+p.id+')"><div class="mimg">'+img+'</div><div class="mbody"><h4>'+esc(p.name)+'</h4><span class="cat">🏥 '+esc(p.pharmacy)+'</span><span class="badge-exp">⏳ '+p.exp+'</span>'+ocrBadge+'<div class="prices"><span class="new">'+p.val.toLocaleString()+'</span><span class="cat">×'+p.qty+'</span></div></div></div>';
  });
  $('marketGrid').innerHTML=html||'<p class="empty">—</p>';
}

async function confirmTransfer(){
  var p=null,u=null;
  for(var i=0;i<listings.length;i++){if(listings[i].id===selId)p=listings[i]}
  for(var j=0;j<users.length;j++){if(users[j].id===session)u=users[j]}
  if(!p||!u)return;
  var sig=await sha256(selId+u.id+Date.now());
  transfers.unshift({id:'TRX-'+Date.now().toString().slice(-8),date:new Date().toISOString(),from:p.pharmacy,to:u.name,value:p.val,sig:sig});
  save('ms_transfers',transfers);
  listings=listings.filter(function(x){return x.id!==selId});
  save('ms_listings',listings);
  closeModal('transferModal');
  $('invId').textContent=transfers[0].id;
  $('invDate').textContent=new Date().toLocaleString(LANG==='ar'?'ar-IQ':'en-US');
  $('invFrom').textContent=p.pharmacy;$('invTo').textContent=u.name;
  $('invSig').textContent=sig.slice(0,28)+'…';
  $('invVal').textContent=p.val.toLocaleString();
  $('invoiceModal').classList.add('show');$('overlay').classList.add('show');
  pushNotify(t('notif_tr'),transfers[0].id);
  renderMarket();
}
function closeModal(id){$(id).classList.remove('show');$('overlay').classList.remove('show')}

function renderReports(){
  var sv=0,tv=0;
  listings.forEach(function(x){sv+=(x.savedKB||0)});
  transfers.forEach(function(x){tv+=(x.value||0)});
  $('repStats').innerHTML='<div class="stat"><div class="num">'+listings.length+'</div><div class="lbl">'+t('st_list')+'</div></div><div class="stat"><div class="num">'+transfers.length+'</div><div class="lbl">'+t('st_tr')+'</div></div><div class="stat"><div class="num">'+tv.toLocaleString()+'</div><div class="lbl">'+t('st_val')+'</div></div><div class="stat"><div class="num">'+sv.toLocaleString()+'KB</div><div class="lbl">'+t('st_saved')+'</div></div>';
  var c={},r={},k;
  listings.forEach(function(p){c[p.cat]=(c[p.cat]||0)+1;r[p.region||'بغداد']=(r[p.region||'بغداد']||0)+1});
  $('repCats').innerHTML=bars(c);$('repRegions').innerHTML=bars(r);
  var rows='';
  transfers.slice(0,10).forEach(function(x){rows+='<tr><td>'+x.id+'</td><td>'+new Date(x.date).toLocaleDateString(LANG==='ar'?'ar-IQ':'en-US')+'</td><td>'+esc(x.from)+'</td><td>'+esc(x.to)+'</td><td>'+(x.value||0).toLocaleString()+'</td></tr>'});
  $('repTable').querySelector('tbody').innerHTML=rows||'<tr><td colspan="5" class="empty">—</td></tr>';
}
function bars(o){
  var m=1,k;
  for(k in o){if(o[k]>m)m=o[k]}
  var html='';
  for(k in o){html+='<div class="bar-row"><span class="bar-lbl">'+esc(k)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(o[k]/m*100)+'%"></div></div><span class="bar-val">'+o[k]+'</span></div>'}
  return html||'—';
}
function exportCSV(){
  var rows=[['Record','Date','From','To','Value','Sig']];
  transfers.forEach(function(x){rows.push([x.id,x.date,x.from,x.to,x.value,x.sig])});
  var csv='\uFEFF'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='MediSync.csv';a.click();
}

function initMap(){
  if(map||!window.L)return;
  map=L.map('mapDiv').setView([33,44],6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'©OSM'}).addTo(map);
  users.forEach(function(u){
    var c=(u.lat!=null&&u.lng!=null)?[u.lat,u.lng]:(RC[u.region]||RC['أخرى']);
    L.marker(c).addTo(map).bindPopup('<b>'+esc(u.name)+'</b><br>'+esc(u.region));
  });
  listings.forEach(function(p){
    var exists=false;
    users.forEach(function(u){if(u.name===p.pharmacy)exists=true});
    if(exists)return;
    var c=(p.lat!=null&&p.lng!=null)?[p.lat,p.lng]:(RC[p.region]||RC['أخرى']);
    L.marker(c).addTo(map).bindPopup('<b>'+esc(p.pharmacy)+'</b><br>'+esc(p.name));
  });
}

function toggleLang(){LANG=LANG==='ar'?'en':'ar';save('ms_lang',LANG);applyLang()}
function applyLang(){
  document.documentElement.lang=LANG;
  document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.dataset.i18n)});
  document.querySelectorAll('[data-i18n-html]').forEach(function(el){el.innerHTML=t(el.dataset.i18nHtml)});
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){el.placeholder=t(el.dataset.i18nPh)});
  $('langBtn').textContent=LANG==='ar'?'EN':'ع';
  renderMarket();
}
function show(p){
  document.querySelectorAll('.page').forEach(function(x){x.classList.remove('active')});
  var el=$('page-'+p);if(el)el.classList.add('active');
  closeDrawers();window.scrollTo(0,0);
  if(p==='browse')renderMarket();
  if(p==='reports')renderReports();
  if(p==='map')setTimeout(initMap,120);
  if(p==='admin')renderAdmin();
}
function gate(p){if(session){show(p)}else{show('auth')}}
function switchTab(x){
  $('tabLogin').classList.toggle('active',x==='login');
  $('tabSignup').classList.toggle('active',x==='signup');
  $('loginForm').style.display=x==='login'?'block':'none';
  $('signupForm').style.display=x==='signup'?'block':'none';
}
function closeDrawers(){['menuDrawer','notifDrawer'].forEach(function(i){$(i).classList.remove('show')});$('overlay').classList.remove('show')}
$('menuBtn').onclick=function(){$('menuDrawer').classList.add('show');$('overlay').classList.add('show')};
$('notifBtn').onclick=function(){renderNotifBadge();$('notifDrawer').classList.add('show');$('overlay').classList.add('show')};
$('overlay').onclick=closeDrawers;
document.querySelectorAll('[data-nav]').forEach(function(el){el.onclick=function(){show(el.dataset.nav)}});
document.querySelectorAll('[data-gate]').forEach(function(el){el.onclick=function(){gate(el.dataset.gate)}});
$('themeBtn').onclick=function(){var h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';$('themeBtn').textContent=h.dataset.theme==='dark'?'☀️':'🌙'};
['bSearch','bCat','bSort'].forEach(function(i){$(i).addEventListener('input',renderMarket)});
function updateConn(){var on=navigator.onLine,b=$('connStatus');b.textContent=on?(LANG==='ar'?'متصل':'Online'):(LANG==='ar'?'غير متصل':'Offline');b.className='status-badge '+(on?'status-online':'status-offline')}
window.addEventListener('online',updateConn);
window.addEventListener('offline',updateConn);
if('serviceWorker'in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(function(){})}
applyLang();updateConn();renderNotifBadge();
if(session)show('home');
$('lExp').min=new Date(Date.now()+30*864e5).toISOString().split('T')[0];
$('notifToggle').checked=load('ms_notif_enabled',true);
</script>
</body>
